{{- if .Values.ingress.enabled }}
{{- /*
  Only the console is exposed over HTTP ingress. The proxy port speaks the
  CONNECT protocol and belongs on its own Service, not behind an HTTP router.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "decrypt0rx.fullname" . }}
  labels:
    {{- include "decrypt0rx.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.apiPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "decrypt0rx.fullname" . }}-api
                port: { number: {{ .Values.api.port }} }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "decrypt0rx.fullname" . }}-web
                port: { number: {{ .Values.web.port }} }
{{- end }}
