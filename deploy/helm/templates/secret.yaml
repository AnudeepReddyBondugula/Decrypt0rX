{{- if not .Values.secrets.existingSecret }}
{{- /*
  Convenience only. Generated values change on every `helm upgrade` unless they
  are pinned, and a new masterKey makes every stored CA private key
  undecryptable - so production should set secrets.existingSecret instead.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "decrypt0rx.fullname" . }}-secrets
  labels:
    {{- include "decrypt0rx.labels" . | nindent 4 }}
type: Opaque
stringData:
  masterKey: {{ required "secrets.masterKey is required when secrets.existingSecret is unset. Generate with: openssl rand -base64 32" .Values.secrets.masterKey | quote }}
  jwtSecret: {{ required "secrets.jwtSecret is required when secrets.existingSecret is unset." .Values.secrets.jwtSecret | quote }}
  databaseUrl: {{ required "secrets.databaseUrl (or postgresql.url) is required." (default .Values.postgresql.url .Values.secrets.databaseUrl) | quote }}
  s3AccessKey: {{ .Values.secrets.s3AccessKey | quote }}
  s3SecretKey: {{ .Values.secrets.s3SecretKey | quote }}
  bootstrapAdminPassword: {{ .Values.bootstrap.adminPassword | quote }}
{{- end }}
