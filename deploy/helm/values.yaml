# Decrypt0rX Helm values.
#
# Postgres, Redis and object storage are NOT deployed by this chart: in a real
# cluster you want a managed or operator-run database rather than a StatefulSet
# bolted onto an app chart. Point the settings below at yours.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: your-org/decrypt0rx
  # Each component is a separate image sharing one tag.
  tag: "0.1.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

# --- External dependencies ----------------------------------------------------
postgresql:
  # postgresql+asyncpg://user:password@host:5432/decrypt0rx
  # Leave empty and set existingSecret to keep the DSN out of values.yaml.
  url: ""
redis:
  url: redis://decrypt0rx-redis:6379/0
objectStorage:
  endpoint: http://decrypt0rx-minio:9000
  bucket: decrypt0rx-bodies
  region: us-east-1

# --- Secrets ------------------------------------------------------------------
# Prefer an existing Secret managed by your secret store. The chart will create
# one from these literals only when existingSecret is empty, which is fine for
# a lab and wrong for production.
secrets:
  existingSecret: ""
  masterKey: ""      # 32 bytes base64; wraps CA private keys at rest
  jwtSecret: ""      # signs GUI sessions
  databaseUrl: ""
  s3AccessKey: ""
  s3SecretKey: ""

bootstrap:
  adminEmail: admin@decrypt0rx.io
  # Blank generates one and prints it once in the API logs.
  adminPassword: ""

# --- Proxy (data plane) -------------------------------------------------------
proxy:
  replicaCount: 2
  port: 8080
  metricsPort: 9090
  healthPort: 8081
  defaultAction: intercept
  verifyUpstream: true
  maxConnections: 4000
  rateLimit:
    enabled: true
    perMinute: 1200
  service:
    type: LoadBalancer
    annotations: {}
    # Interception is per-connection state; keeping a client on one replica
    # avoids re-handshaking on every new connection.
    sessionAffinity: ClientIP
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Long-lived tunnels should not be cut off mid-transfer on a rollout.
  terminationGracePeriodSeconds: 60
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- API (control plane) ------------------------------------------------------
api:
  replicaCount: 2
  port: 8000
  corsOrigins: ""      # defaults to the web ingress host when empty
  flowRetentionDays: 14
  autoCreateSchema: true
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75

# --- Web GUI ------------------------------------------------------------------
web:
  replicaCount: 2
  port: 3000
  # Must be the API URL a BROWSER can reach; baked into the image at build time,
  # so changing it here requires rebuilding the web image with the same value.
  publicApiUrl: ""
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# --- Ingress (web + API; the proxy port is NOT an HTTP ingress) ---------------
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"  # WebSocket flow feed
  host: decrypt0rx.example.com
  apiPath: /api
  tls:
    enabled: true
    secretName: decrypt0rx-tls

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

logging:
  level: INFO
  format: json

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # the proxy writes forged certs to a temp dir
  capabilities: { drop: ["ALL"] }
