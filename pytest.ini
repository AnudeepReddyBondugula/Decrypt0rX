[pytest]
asyncio_mode = auto
# importlib mode derives a unique module name from each file's full path. The
# test directories deliberately have no __init__.py: with packages, all three
# would be named "tests" and their conftest files would collide — and whether
# they collided depended on how pytest was invoked, since `python -m pytest`
# puts the working directory on sys.path while the `pytest` script does not.
addopts = --import-mode=importlib
testpaths = packages/core/tests services/proxy/tests services/api/tests
filterwarnings =
    ignore::DeprecationWarning
