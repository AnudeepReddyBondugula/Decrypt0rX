name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: decrypt0rx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DECRYPT0RX_TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/decrypt0rx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core \
                      -r services/proxy/requirements.txt \
                      -r services/api/requirements.txt \
                      pytest pytest-asyncio httpx
          pip install -e services/proxy
      - name: Test
        run: pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [python, web]
    strategy:
      matrix:
        component: [proxy, api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.component }}
          # Build only; publishing is a separate, credentialed workflow.
          push: false
          tags: decrypt0rx-${{ matrix.component }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
