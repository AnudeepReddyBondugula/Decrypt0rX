[project]
name = "decrypt0rx-core"
version = "0.1.0"
description = "Shared models, crypto and settings for the Decrypt0rX platform"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["decrypt0rx_core*"]
